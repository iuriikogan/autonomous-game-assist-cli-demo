steps:
  # 1. Code Linting
  - name: 'golang:latest'
    entrypoint: 'go'
    args: ['vet', './...']
    id: 'go-lint'

  # 2. Automated Test Execution
  - name: 'golang:latest'
    entrypoint: 'go'
    args: ['test', '-v', './...']
    id: 'go-tests'
    waitFor: ['go-lint']

  # 3. IaC Security Scanning (Trivy)
  # Validates Terraform configurations against security best practices
  - name: 'aquasec/trivy:latest'
    entrypoint: 'trivy'
    args: ['config', '--severity', 'HIGH,CRITICAL', '--exit-code', '1', 'deployments/terraform']
    id: 'iac-scan'
    waitFor: ['go-tests']

  # 4. Docker Build (Local Image Creation)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGISTRY_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY_NAME/agent-runner:$_COMMIT_SHA'
      - '.'
    id: 'docker-build'
    waitFor: ['iac-scan']

  # 7. Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_REGISTRY_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY_NAME/agent-runner:$_COMMIT_SHA'
    id: 'docker-push'
    waitFor: ['docker-build']

substitutions:
  _REGISTRY_LOCATION: 'us-central1'
  _REPOSITORY_NAME: 'autonomous-game-assist'
  _COMMIT_SHA: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY

